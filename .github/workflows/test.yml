name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  perl:
    name: ${{ matrix.os }} / Perl ${{ matrix.perl }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, perl: '5.20'}
          - {os: ubuntu-latest, perl: '5.34'}
          - {os: ubuntu-latest, perl: '5.40'}
          - {os: ubuntu-latest, perl: '5.44'}
          - {os: macos-latest, perl: '5.40'}
          - {os: windows-latest, perl: '5.40'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shogo82148/actions-setup-perl@84c44b5a14f12b311f1bf3d2a70c8807f30b7ab2 # v1
        with:
          perl-version: ${{ matrix.perl }}
      - name: Configure and test
        env:
          HARNESS_PERL_SWITCHES: -Mwarnings=FATAL,all
        run: |
          perl Makefile.PL
          prove -lr t
      - name: Examples
        run: |
          perl -Ilib examples/send.pl example.wav CQ DE TESTCALL
          perl -Ilib examples/receive.pl example.wav
          perl -Ilib examples/midi.pl example.mid CQ DE TESTCALL
          perl -Ilib examples/workflows.pl
  fast:
    name: PDL / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shogo82148/actions-setup-perl@84c44b5a14f12b311f1bf3d2a70c8807f30b7ab2 # v1
        with:
          perl-version: '5.40'
      - name: Install PDL
        run: cpanm --verbose --notest PDL
      - name: Verify PDL backend and compatibility
        env:
          HARNESS_PERL_SWITCHES: -Mwarnings=FATAL,all
        run: |
          perl -Ilib -MHam::CW::_Internal::PDL -e 1
          perl Makefile.PL
          prove -lr t
  author:
    name: Author checks and distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shogo82148/actions-setup-perl@84c44b5a14f12b311f1bf3d2a70c8807f30b7ab2 # v1
        with:
          perl-version: '5.40'
      - name: Install author tools
        run: |
          cpanm --notest 'Perl::Tidy@20260826'
          cpanm --notest PDL
          cpanm --notest --installdeps --with-develop .
      - name: Build and check metadata, POD and style
        run: |
          perl Makefile.PL
          make
          make test
          make distmeta
          prove -lr xt
      - name: Coverage gates
        env:
          HARNESS_PERL_SWITCHES: -MDevel::Cover=-db,${{ runner.temp }}/ham-cw-cover,-select,lib/Ham,-ignore,^t/
        run: prove -lr t
      - name: Check measured coverage
        run: perl maint/coverage.pl '${{ runner.temp }}/ham-cw-cover'
      - name: Test release archive
        run: |
          make distcheck
          make disttest
          make dist
          perl -Ilib -MHam::CW -e 'exec $^X, "maint/check-dist.pl", "Ham-CW-$Ham::CW::VERSION.tar.gz"'
          perl -Ilib -MHam::CW -e 'exec $^X, "maint/check-install.pl", "Ham-CW-$Ham::CW::VERSION.tar.gz"'
